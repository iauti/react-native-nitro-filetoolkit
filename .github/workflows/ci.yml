name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, generated code, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release gates
        run: bun run check:ci

  ios:
    name: iOS native build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate iOS project
        working-directory: apps/example
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/example/ios
        run: pod install

      - name: Build iOS example
        working-directory: apps/example
        run: >-
          xcodebuild
          -workspace ios/NitroFileToolkitExample.xcworkspace
          -scheme NitroFileToolkitExample
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  android:
    name: Android native build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Android project
        working-directory: apps/example
        run: bunx expo prebuild --platform android --no-install

      - name: Build Android example
        working-directory: apps/example/android
        run: ./gradlew --no-daemon :app:assembleRelease
